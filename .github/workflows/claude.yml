name: Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Needs the repo secret ANTHROPIC_API_KEY. Neither job is a required check:
# findings inform the human who merges (POLICY rule 8).
jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the policy reviewer for this repository. The PR branch is checked out.

            1. Read POLICY.md. It is the only rulebook; do not invent rules.
            2. Read the PR body with `gh pr view ${{ github.event.pull_request.number }} --json title,body`.
               If it links an intent, spec or plan under intents/ or docs/, read those files and
               check the diff against the plan's "Files that change" (rule 6).
            3. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            4. Check every rule in POLICY.md against the diff and the PR body.
            5. Post exactly one top-level comment with `gh pr comment` in the format POLICY.md
               describes: first line `VERDICT: PASS` or `VERDICT: FAIL`, then Important findings
               with rule numbers and files, then at most five Nits.
            6. For each Important finding tied to a specific line, also add an inline comment with
               mcp__github_inline_comment__create_inline_comment (confirmed: true).

            Do not edit files, do not approve, do not merge. Only post comments.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: |
            --max-turns 30
            --append-system-prompt "Follow CLAUDE.md and POLICY.md. Work only on the PR branch; never push to main. If asked to change .github/workflows, .claude, CLAUDE.md or POLICY.md, say that the owner must approve and stop. Run lint, test and build before reporting done and paste the output."
