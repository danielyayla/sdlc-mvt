name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Job names (lint, test, build) are the required status checks on main.
# Until intent 001 adds package.json, each job passes with "no app yet".
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "no app yet, skipping"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "no app yet, skipping"; fi
          if ls playwright.config.* >/dev/null 2>&1; then echo "e2e=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm test
      - if: steps.app.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.app.outputs.e2e == 'true'
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "no app yet, skipping"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run build
